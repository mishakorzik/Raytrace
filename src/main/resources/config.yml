worlds:
  world:
    enabled: true
    # Checked top-down. Each band extends down to the next below-y, or to bedrock.
    # Every block below below-y is replaced unless the viewer has earned that cell.
    layers:
      - below-y: 128
        block: STONE
      - below-y: 0
        block: DEEPSLATE
    # Hide mobs (animals, monsters, villagers) behind walls or inside unearned terrain.
    hide-mobs: true
    # Hide other players behind walls or inside unearned terrain.
    hide-players: true
    # Hide minecarts of every kind, boats and chest boats.
    hide-vehicles: true
    # Hide item frames, paintings, armor stands and display entities.
    hide-decorations: true
    # Hide dropped items.
    hide-items: true
    # Natural terrain this close to the real surface stays real. This keeps beaches, oceans,
    # ice, tree lines and cave entrances visually correct. The value is measured in blocks
    # above the cutoff: for soil, the top surface-buffer blocks are not replaced by fake stone.
    # Ores, chests, spawners and similar valuable blocks inside this buffer are still hidden
    # until the player earns their cell. Larger = smoother surface but a larger hidden band;
    # smaller = stricter but blockier. Negative disables surface awareness and uses below-y.
    surface-buffer: 4

  world_nether:
    enabled: true
    layers:
      - below-y: 128
        block: NETHERRACK
    # Hide mobs (animals, monsters, villagers) behind walls or inside unearned terrain.
    hide-mobs: true
    # Hide other players behind walls or inside unearned terrain.
    hide-players: true
    # Hide minecarts of every kind, boats and chest boats.
    hide-vehicles: true
    # Hide item frames, paintings, armor stands and display entities.
    hide-decorations: true
    # Hide dropped items.
    hide-items: true
    surface-buffer: 2

  world_the_end:
    enabled: true
    layers:
      - below-y: 128
        block: END_STONE
    # Hide mobs (animals, monsters, villagers) behind walls or inside unearned terrain.
    hide-mobs: true
    # Hide other players behind walls or inside unearned terrain.
    hide-players: true
    # Hide minecarts of every kind, boats and chest boats.
    hide-vehicles: true
    # Hide item frames, paintings, armor stands and display entities.
    hide-decorations: true
    # Hide dropped items.
    hide-items: true
    surface-buffer: 2

# Grids and scan limits. All intervals are in server ticks (20 ticks = 1 second).
grids:
  blocks:
    # Size of one terrain cell: a cube of size x size x size blocks. When a player sees part
    # of a cell, the whole cell becomes real for them.
    # Bigger = less CPU, but more real blocks appear around what the player looks at (shallow
    # ores can show). Smaller = more precise hiding, but more updates. Range 1-16.
    # This is also the effective "beam width": the rays are mathematical lines, so a bigger
    # cell is what makes each ray reveal a wider swath. There is no separate ray-width option.
    size: 8
    # How many solid blocks a terrain ray may pass through before it stops.
    # Terrain is only revealed through as many solid blocks as entities.occlusion-blocks allows. Range 1-8.
    occlusion-grace-blocks: 2
    # How often the full terrain scan may run. 2 = up to 10 times per second.
    # Higher = less CPU, but far terrain appears later. What the player looks at directly
    # still updates every tick while they move or turn. Range 1-20.
    scan-ticks: 2
    # Skip a full scan unless the player moved at least this many blocks since the last one.
    # Higher = less CPU, slower updates while walking. Range 0.1-16.0.
    move-threshold-blocks: 1.2
    # Skip a full scan unless the player turned left or right at least this many degrees. Range 0.1-120.0.
    yaw-threshold-degrees: 6.0
    # Skip a full scan unless the player looked up or down at least this many degrees. Range 0.1-120.0.
    pitch-threshold-degrees: 4.0
    # Time limit of one scan for one player, in microseconds (1000 = 1 ms). When it runs out,
    # the scan stops and the next one continues. Lower it on a busy server; raise it only if
    # terrain appears too slowly on a quiet one. Range 100-20000.
    max-scan-micros: 1000
    # Most block steps all rays together may take in one scan. A second safety limit next to
    # max-scan-micros.
    max-steps-per-scan: 80000
    # How many rays make up the full scan pattern. More = fewer missed cells at a distance,
    # more CPU. Fewer = faster, but gaps may appear far away. The scan already scales the
    # pattern down to this budget; raising the cell size is usually a better first saving. Range 100-10000.
    target-total-rays: 2600
    # Most blocks revealed to one player in one scan. A size 8 cell is 512 blocks, so 40000
    # is about 78 cells. The rest waits for the next scan. At least one cell is always revealed. Range 10000-100000.
    max-revealed-blocks-per-scan: 40000

  entities:
    # How many sample points are checked across an entity's body: 4 means up to 4x4 = 16 rays.
    # A clearly visible entity costs only 1 ray; the other points are used only when its centre
    # is blocked, so a mob peeking around a corner still shows. Bigger = smoother edges, more
    # CPU for hidden entities. Smaller = faster, coarser edges. Range 1-9.
    size: 4
    # How often entities are rechecked. 2 = 10 times per second. An entity is not rechecked
    # while neither it nor the player has moved. Range 1-20.
    scan-ticks: 2
    # Only entities within this many blocks are checked. Keep it at least as large as the
    # server's entity-tracking-range, or farther entities are never hidden. Range 8-200.
    scan-radius-blocks: 128
    # How many solid blocks may lie between the player's eye and an entity before it is hidden.
    # 1 = one thin wall hides it. Higher = entities stay visible behind more cover. This also
    # limits how deep terrain is revealed through walls. Range 1-8.
    occlusion-blocks: 1

# Mute a sound only when it is at least this far away and behind solid blocks. Range 1.0-128.0.
far-sound-distance: 48.0

# Important sounds that never muted.
important-sounds:
  - explode
  - explosion
  - ender_dragon
  - end_crystal
  - wither
  - end_portal
  - beacon
  - raid
  - bell

# Cancel particles, block animations and minor sounds whose origin is hidden from the viewer.
# Block updates and hidden block-entity data are always kept consistent and are not controlled
# by this switch. Important sounds are always allowed.
hide-effects: true
